services:
  postgres:
    image: postgres:17-alpine
    container_name: watchparty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watchparty
      POSTGRES_USER: watchparty
      POSTGRES_PASSWORD: watchparty
    ports:
      - "5432:5432"
    volumes:
      - watchparty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchparty -d watchparty"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  watchparty_pgdata:
